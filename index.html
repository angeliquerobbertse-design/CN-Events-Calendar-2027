<title>Condé Nast 2027 Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Poppins:wght@400;500;600&display=swap">
<style>
/* Layout: white editorial page, hairline rules, black type, a slim left index, one red accent used sparingly */
:root{
  color-scheme:light;
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#111111; --muted:#6F6F6F; --line:#E4E4E4; --line-strong:#111111;
  --red:#B5121B; --gold:#8C6D1F; --gold-soft:#F6F1E4; --red-soft:#FBE9EA;
  --gq:#111111; --gl:#C9677F; --hg:#2F5D4E; --ev:#8C6D1F;
  --t-gq:#E8E8E8; --t-gl:#F9DEE5; --t-hg:#EDE3CF; --t-ev:#FFFFFF;
  --rail-bg:#FFFFFF; --rail-fg:#111111; --rail-mute:#8A8A8A;
  --bar-plan:#E2E2E2; --bar-sell:#111111; --bar-prod:#9A9A9A;
  --f-display:'Fraunces',Georgia,serif; --f-body:'Poppins',system-ui,sans-serif; --f-mono:'Poppins',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:13px/1.45 var(--f-body);padding-inline:0}
.app{display:grid;grid-template-columns:148px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail-bg);color:var(--rail-fg);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;display:flex;flex-direction:column;gap:12px}
.rail h1{font:500 16px/1.1 var(--f-display);margin:0;letter-spacing:.01em}
.rail h1 small{display:block;font:500 7.5px var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--rail-mute);margin-top:4px}
.rail nav{display:flex;flex-direction:column;gap:2px}
.rail nav button{all:unset;cursor:pointer;padding:6px 0;border-bottom:1px solid var(--line);color:var(--rail-mute);font-weight:500;font-size:11.5px;letter-spacing:.03em;display:flex;justify-content:space-between;gap:8px}
.rail nav button:hover{color:var(--rail-fg)}
.rail nav button[aria-current="true"]{color:var(--rail-fg);border-bottom:2px solid var(--line-strong);font-weight:600}
.rail nav button:focus-visible,.chip:focus-visible,select:focus-visible,input:focus-visible,.cal-day:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.rail .foot{margin-top:auto;color:var(--rail-mute);font-size:9px;line-height:1.45}
main{padding:20px 22px 40px;min-width:0}
.head{display:flex;flex-wrap:wrap;gap:6px 24px;align-items:baseline;justify-content:space-between}
.head h2{font:500 30px/1.1 var(--f-display);letter-spacing:-.005em;margin:0;text-wrap:balance}
.head p{margin:0;color:var(--muted);max-width:none;flex:1 1 360px}
.next{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:14px 0}
.next div{background:var(--surface);border:0;border-top:2px solid var(--line-strong);padding:9px 0 4px;min-width:0}
.next b{display:block;font:500 10px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.next .t{display:block;font-weight:600}
.next .m{display:block;font:400 11.5px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.next .hot{color:var(--red);font-weight:500}
.bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 0;border-block:1px solid var(--line);margin-bottom:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{all:unset;cursor:pointer;padding:4px 11px;border:1px solid var(--line);background:var(--t,var(--surface));color:var(--ink);font-weight:500;font-size:11.5px;letter-spacing:.04em;display:inline-flex;gap:6px;align-items:center}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted));display:inline-block}
.chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink);font-weight:600}
.chip[aria-pressed="false"]{opacity:.5}
label.f{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:12px}
select,input[type=range]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);padding:3px 6px}
input[type=range]{padding:0;accent-color:var(--red);width:90px}
.pill{display:inline-block;padding:1px 7px;font:600 9.5px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:var(--t,transparent);border:1px solid var(--line);white-space:nowrap}
[data-b="GQ"]{--c:var(--gq);--t:var(--t-gq)} [data-b="Glamour"]{--c:var(--gl);--t:var(--t-gl)} [data-b="HG"]{--c:var(--hg);--t:var(--t-hg)} [data-b="Events"]{--c:var(--ev);--t:var(--t-ev)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
/* monthly plan */
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(460px,1fr));gap:18px;align-items:start}
.month{background:var(--surface);border:1px solid var(--line);border-top:2px solid var(--line-strong);padding:16px 18px 18px;min-width:0;font-size:11.5px}
.month h3{font:500 18px var(--f-display);margin:0 0 14px;display:flex;justify-content:space-between;align-items:baseline}
.month h3 span{font:400 10px var(--f-mono);color:var(--muted)}
.month section+section{margin-top:22px}
.month h4{margin:0 0 6px;font:600 9px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.row>span:last-child,.cal-day>span:last-child,.pl>span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:grid;grid-template-columns:54px 64px minmax(0,1fr);gap:10px;align-items:baseline;padding:5px 0;line-height:1.4;border-top:1px dotted var(--line)}
.row .d{font:400 10px var(--f-mono);color:var(--muted);white-space:nowrap}
.none{color:var(--muted);font-style:italic}
.row.past{opacity:.5}
.month .pill{font-size:8px;padding:1px 6px;letter-spacing:.06em}
.month .tag{font-size:8.5px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(460px,1fr));gap:18px;align-items:start}
.cal-m{background:var(--surface);border:1px solid var(--line);border-top:2px solid var(--line-strong);padding:16px 18px 18px;min-width:0;font-size:11.5px}
.cal-m h3{font:500 18px var(--f-display);margin:0 0 14px;display:flex;justify-content:space-between;align-items:baseline}
.cal-m h3 span{font:400 10px var(--f-mono);color:var(--muted)}
.cal-day{display:grid;grid-template-columns:54px 64px minmax(0,1fr);gap:10px;padding:5px 0;line-height:1.4;border-top:1px dotted var(--line);align-items:baseline}
.cal-day .n{font:400 10px var(--f-mono);color:var(--muted);white-space:nowrap}
.cal-m .pill{font-size:8px;padding:1px 6px;letter-spacing:.06em}
.cal-m .tag{font-size:8.5px;margin-right:4px}
.tag{font:600 9.5px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tag.sale{color:var(--hg)} .tag.dl{color:var(--red)} .tag.ev{color:var(--gold)} .tag.sb{color:var(--muted)}
/* pipeline */
.gantt{background:var(--surface);border:1px solid var(--line);border-top:2px solid var(--line-strong);padding:12px 14px;overflow-x:auto}
.g-inner{min-width:760px}
.g-axis,.g-row{display:grid;grid-template-columns:176px minmax(0,1fr);gap:10px;align-items:center}
.g-axis .track{position:relative;height:18px;border-bottom:1px solid var(--line)}
.g-axis .track span{position:absolute;top:0;font:400 10px var(--f-mono);color:var(--muted);transform:translateX(-1px);padding-left:3px;border-left:1px solid var(--line);height:18px}
.g-row{padding:3px 0;border-bottom:1px dotted var(--line)}
.g-lab{display:flex;gap:6px;align-items:center;min-width:0;font-size:12px}
.g-lab span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{position:relative;height:16px}
.seg{position:absolute;top:3px;height:10px}
.seg.plan{background:var(--bar-plan)} .seg.sell{background:var(--bar-sell)} .seg.prod{background:var(--bar-prod)}
.mk{position:absolute;top:0;width:3px;height:16px;background:var(--red)}
.mk.ev{background:var(--ev);width:10px;height:10px;top:3px;transform:rotate(45deg)}
.today{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--red);pointer-events:none}
.g-grp{font:500 16px var(--f-display);margin:10px 0 2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;color:var(--muted);font-size:11.5px}
.legend i{display:inline-block;width:16px;height:8px;margin-right:5px;vertical-align:middle}
.pm{table-layout:fixed;font-size:11.5px}
.pm th{padding:8px 10px;background:var(--t,var(--surface));color:var(--ink)}
.pm td{padding:10px;border-left:1px solid var(--line);border-bottom:1px solid var(--line)}
.pm th.pmm,.pm td.pmm{width:92px;border-left:0;white-space:nowrap}
.pm td.pmm b{font:500 14px var(--f-display)}
.pm tr.now td.pmm{box-shadow:inset 3px 0 0 var(--line-strong)}
.pl{display:grid;grid-template-columns:22px minmax(0,1fr);gap:6px;padding:3px 0;line-height:1.4;align-items:baseline}
.pl+.pl{border-top:1px dotted var(--line)}
.pl .d{font:400 10px var(--f-mono);color:var(--muted)}
.pl.past{opacity:.5}
.pm .tag{font-size:8.5px;margin-right:2px}
/* lead time */
.tw{background:var(--surface);border:1px solid var(--line);border-top:2px solid var(--line-strong);overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{white-space:nowrap;padding:6px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 9.5px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:var(--surface);position:sticky;top:0}
td.mono{font-size:11.5px;white-space:nowrap}
td.n{text-align:right}
.st{font-weight:600;font-size:11px;white-space:nowrap}
.st.closed{color:var(--muted)} .st.hot{color:var(--red)} .st.warm{color:var(--gold)} .st.open{color:var(--hg)}
.sellby{background:var(--gold-soft)}
.note{margin-top:12px;color:var(--muted);font-size:11.5px;max-width:none}
.note b{color:var(--ink)}
h3.sub{font:500 20px var(--f-display);margin:20px 0 8px}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;padding:14px 16px;gap:10px;border-right:0;border-bottom:1px solid var(--line)}
  .rail nav{flex-direction:row;flex-wrap:wrap;gap:4px 16px}
  .rail .foot{display:none}
  main{padding:14px 16px 32px}
  .months{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:no-preference){.month,.cal-m{transition:border-color .15s}.month:hover,.cal-m:hover{border-color:var(--gold)}}
</style>

</div>

const BR = {GQ:'GQ', Glamour:'Glamour', HG:'House & Garden', Events:'Events'};
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONF = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const D0 = new Date(); D0.setHours(0,0,0,0);
const P = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const fmt = (d, yr) => d.getDate()+' '+MON[d.getMonth()]+(yr===false?'':' '+d.getFullYear());
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const dayDiff = (a,b) => Math.round((b-a)/864e5);
const mkey = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const mlabel = k => { const [y,m]=k.split('-').map(Number); return MON[m-1]+' '+y; };
const mlabelF = k => { const [y,m]=k.split('-').map(Number); return MONF[m-1]+' '+y; };

const S = { view:'monthly', brands:new Set(['GQ','Glamour','HG','Events']), month:'all', type:'all', sw:6, ew:16 };
try { const v = localStorage.getItem('cn-view'); if (v) S.view = v; } catch(e){}

// Month range: Oct 2026 to Dec 2027
const MONTHS = []; for (let i=0;i<15;i++){ const d=new Date(2026,9+i,1); MONTHS.push(mkey(d)); }

function items(){
  const out = [];
  DATA.issues.forEach(i => {
    out.push({kind:'print', brand:i.brand, label:i.brandName+' '+i.issue+(i.theme?' · '+i.theme:''), issue:i,
      planning:P(i.planning), cover:P(i.cover), adv:P(i.adv), deadline:P(i.deadline), inserts:P(i.inserts), despatch:P(i.despatch), onsale:P(i.onsale),
      sellBy:addDays(P(i.deadline), -7*S.sw), coverFlag:!!i.coverFlag});
  });
  DATA.events.forEach(e => {
    const [y,m] = e.month.split('-').map(Number);
    const date = new Date(y,m-1,15);
    out.push({kind:'event', brand:'Events', label:e.title, ev:e, date, sellBy:addDays(date,-7*S.ew), tbc:e.tbc});
  });
  return out.filter(x => S.brands.has(x.brand));
}

function entries(){
  // flat list of dated entries for monthly + calendar views
  const E = [];
  items().forEach(x => {
    if (x.kind==='print'){
      E.push({t:'sale', d:x.onsale, x, txt:x.label});
      E.push({t:'dl', d:x.deadline, x, txt:x.label});
      E.push({t:'sb', d:x.sellBy, x, txt:x.label});
    } else {
      E.push({t:'ev', d:x.date, x, txt:x.label, est:true});
      E.push({t:'sb', d:x.sellBy, x, txt:x.label, est:true});
    }
  });
  return E.sort((a,b)=>a.d-b.d);
}
const TT = {sale:'On sale', dl:'Booking deadline', sb:'Sell by', ev:'Event'};

function pill(b){ return '<span class="pill" data-b="'+b+'">'+(b==='HG'?'H&amp;G':b)+'</span>'; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

/* ---------- next to close ---------- */
function renderNext(){
  const up = items().filter(x=>x.kind==='print' && x.deadline>=D0).sort((a,b)=>a.deadline-b.deadline).slice(0,3);
  const el = document.getElementById('next');
  if (!up.length){ el.innerHTML=''; return; }
  el.innerHTML = up.map((x,i)=>{
    const dd = dayDiff(D0,x.deadline);
    return '<div><b>'+(i===0?'Next booking deadline':'Then')+'</b><span class="t">'+pill(x.brand)+' '+esc(x.issue.issue)+'</span><span class="m">'+fmt(x.deadline)+' · <span class="'+(dd<=21?'hot':'')+'">'+dd+' days</span> · on sale '+fmt(x.onsale,false)+'</span></div>';
  }).join('');
}

/* ---------- monthly plan ---------- */
function monthRows(list, withDate){
  return list.map(e=>'<div class="row'+(e.d<D0?' past':'')+'"><span class="d">'+(e.est?'~':'')+fmt(e.d,false)+'</span><span>'+pill(e.x.brand)+'</span><span>'+esc(e.txt)+(e.x.tbc?' <span class="tag">date TBC</span>':'')+'</span></div>').join('');
}
function renderMonthly(){
  const E = entries();
  const list = S.month==='all' ? MONTHS : [S.month];
  document.getElementById('view').innerHTML = '<div class="months">' + list.map(k=>{
    const inM = t => E.filter(e=>e.t===t && mkey(e.d)===k);
    const sale = inM('sale'), dl = inM('dl'), sb = inM('sb'), ev = inM('ev');
    const sec = (title, L) => L.length ? '<section><h4>'+title+'</h4>'+monthRows(L)+'</section>' : '';
    const body = sec('Selling now (sell by this month)', sb)+sec('Booking deadlines', dl)+sec('On sale', sale)+sec('Events', ev);
    if (!body) return '';
    return '<article class="month"><h3>'+mlabelF(k)+'<span>'+(sale.length+dl.length+ev.length)+' dates</span></h3>'+body+'</article>';
  }).join('') + '</div>';
}

/* ---------- calendar ---------- */
function renderCalendar(){
  const E = entries().filter(e => (e.t==='dl' || e.t==='ev') && (S.type==='all' || e.t===S.type));
  const list = S.month==='all' ? MONTHS : [S.month];
  document.getElementById('view').innerHTML = '<div class="cal">' + list.map(k=>{
    const rows = E.filter(e=>mkey(e.d)===k);
    return '<article class="cal-m"><h3>'+mlabelF(k)+(rows.length?'<span>'+rows.length+(rows.length===1?' date':' dates')+'</span>':'')+'</h3>'+(rows.length?rows.map(e=>
      '<div class="cal-day" tabindex="0"><span class="n">'+(e.est?'~':'')+fmt(e.d,false)+'</span><span>'+pill(e.x.brand)+'</span><span><span class="tag '+e.t+'">'+(e.t==='dl'?'Booking deadline':'Event')+'</span> '+esc(e.txt)+'</span></div>').join(''):'<div class="none">No dates</div>')+'</article>';
  }).join('') + '</div>';
}

/* ---------- pipeline ---------- */
function renderPipeline(){
  const its = items();
  const brands = ['GQ','Glamour','HG','Events'].filter(b=>S.brands.has(b));
  const KEY = {};
  const add = (d,b,cls,lab,txt,est) => { const k=mkey(d); KEY[k]=KEY[k]||{}; (KEY[k][b]=KEY[k][b]||[]).push({d,cls,lab,txt,est}); };
  its.forEach(x=>{
    if (x.kind==='print'){
      const n = x.issue.issue;
      add(x.planning,x.brand,'pn','Planning',n);
      add(x.cover,x.brand,'pn','Cover approval',n);
      add(x.sellBy,x.brand,'sb','Sell by',n);
      add(x.deadline,x.brand,'dl','Booking deadline',n);
      add(x.onsale,x.brand,'sale','On sale',n);
    } else {
      add(x.sellBy,x.brand,'sb','Sell by',x.label,true);
      add(x.date,x.brand,'ev','Event',x.label,true);
    }
  });
  const keys = Object.keys(KEY).sort();
  let html = '<div class="tw"><table class="pm"><thead><tr><th class="pmm">Month</th>'+brands.map(b=>'<th data-b="'+b+'">'+BR[b]+'</th>').join('')+'</tr></thead><tbody>';
  keys.forEach(k=>{
    const now = k===mkey(D0);
    html += '<tr'+(now?' class="now"':'')+'><td class="pmm"><b>'+mlabel(k)+'</b>'+(now?'<br><span class="tag">This month</span>':'')+'</td>';
    brands.forEach(b=>{
      const L = ((KEY[k]||{})[b]||[]).sort((a,c)=>a.d-c.d);
      html += '<td>'+L.map(e=>'<div class="pl'+(e.d<D0?' past':'')+'"><span class="d">'+(e.est?'~':'')+e.d.getDate()+'</span><span><span class="tag '+e.cls+'">'+e.lab+'</span> '+esc(e.txt)+'</span></div>').join('')+'</td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  html += '<div class="legend"><span><span class="tag">Planning</span> and cover approval</span><span><span class="tag">Sell by</span> = booking deadline minus the sell-in lead</span><span><span class="tag dl">Booking deadline</span></span><span><span class="tag sale">On sale</span></span><span><span class="tag ev">Event</span> (~ mid-month estimate)</span></div>';
  document.getElementById('view').innerHTML = html;
}

/* ---------- lead time ---------- */
function status(dl){
  const n = dayDiff(D0,dl);
  if (n<0) return '<span class="st closed">Closed</span>';
  if (n<=21) return '<span class="st hot">Closes in '+n+' days</span>';
  if (n<=60) return '<span class="st warm">Closes in '+n+' days</span>';
  return '<span class="st open">Open · '+n+' days</span>';
}
function renderLead(){
  const its = items();
  const pr = its.filter(x=>x.kind==='print').sort((a,b)=>a.deadline-b.deadline).filter(x=>S.month==='all'||mkey(x.deadline)===S.month||mkey(x.onsale)===S.month);
  let html = '<div class="tw"><table><thead><tr><th>Title</th><th>Issue</th><th>Planning</th><th>Cover approval</th><th>Sell by</th><th>Booking deadline</th><th>Advertorial in</th><th>Inserts due</th><th>On sale</th><th class="n">Plan to deadline</th><th class="n">Deadline to on sale</th><th>Status</th></tr></thead><tbody>';
  html += pr.map(x=>'<tr><td>'+pill(x.brand)+'</td><td>'+esc(x.issue.issue)+(x.issue.theme?' <span class="tag">'+esc(x.issue.theme)+'</span>':'')+'</td><td class="mono">'+fmt(x.planning)+'</td><td class="mono">'+fmt(x.cover)+(x.coverFlag?' <span class="tag" title="Printed with the year 2022 in the PDF">check</span>':'')+'</td><td class="mono sellby">'+fmt(x.sellBy)+'</td><td class="mono"><b>'+fmt(x.deadline)+'</b></td><td class="mono">'+fmt(x.adv)+'</td><td class="mono">'+fmt(x.inserts)+'</td><td class="mono">'+fmt(x.onsale)+'</td><td class="mono n">'+Math.round(dayDiff(x.planning,x.deadline)/7)+' wks</td><td class="mono n">'+Math.round(dayDiff(x.deadline,x.onsale)/7)+' wks</td><td>'+status(x.deadline)+'</td></tr>').join('');
  if (!pr.length) html += '<tr><td colspan="12" class="none">No print issues for this selection.</td></tr>';
  html += '</tbody></table></div>';
  const ev = its.filter(x=>x.kind==='event').sort((a,b)=>a.date-b.date).filter(x=>S.month==='all'||mkey(x.date)===S.month||mkey(x.sellBy)===S.month);
  if (ev.length){
    html += '<h3 class="sub">Events</h3><div class="tw"><table><thead><tr><th>Event</th><th>Month</th><th>Sell by</th><th class="n">Lead</th><th>Status</th><th>Note</th></tr></thead><tbody>'+
      ev.map(x=>'<tr><td>'+pill('Events')+' '+esc(x.label)+'</td><td class="mono">~'+mlabel(x.ev.month)+'</td><td class="mono sellby">~'+fmt(x.sellBy)+'</td><td class="mono n">'+S.ew+' wks</td><td>'+(x.sellBy<D0?'<span class="st hot">Sell-by passed</span>':'<span class="st open">Open · '+dayDiff(D0,x.sellBy)+' days to sell-by</span>')+'</td><td>'+esc(x.ev.note)+' · date TBC</td></tr>').join('')+'</tbody></table></div>';
  }
  document.getElementById('view').innerHTML = html;
}

/* ---------- chrome ---------- */
const VIEWS = {
  monthly:{t:'Monthly plan', d:'What to sell, what closes and what goes on sale each month, for each title. Sell-by dates move with the sell-in lead setting.', r:renderMonthly, month:true},
  calendar:{t:'Calendar', d:'What is happening each month: booking deadlines and events by brand, to show how busy each brand is and where the load builds. On-sale and sell-by dates are on the Monthly plan.', r:renderCalendar, month:true, type:true},
  pipeline:{t:'Pipeline', d:'Everything to do each month, by brand: planning, cover approval, sell-by, booking deadlines, on-sale dates and events.', r:renderPipeline, month:false},
  lead:{t:'Lead time', d:'The production dates a rep needs per issue, sorted by booking deadline, with how many weeks each stage gives you.', r:renderLead, month:true}
};
function chrome(){
  const nav = document.getElementById('nav');
  nav.innerHTML = Object.entries(VIEWS).map(([k,v])=>'<button data-v="'+k+'" aria-current="'+(S.view===k)+'">'+v.t+'</button>').join('');
  nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{ S.view=b.dataset.v; try{localStorage.setItem('cn-view',S.view);}catch(e){} draw(); });
  document.getElementById('brands').innerHTML = ['GQ','Glamour','HG','Events'].map(b=>'<button class="chip" data-b="'+b+'" style="--c:var(--'+({GQ:'gq',Glamour:'gl',HG:'hg',Events:'ev'})[b]+')" aria-pressed="'+S.brands.has(b)+'"><i></i>'+BR[b]+'</button>').join('');
  document.querySelectorAll('#brands .chip').forEach(c=>c.onclick=()=>{ const b=c.dataset.b; S.brands.has(b)?S.brands.delete(b):S.brands.add(b); if(!S.brands.size) S.brands.add(b); draw(); });
  const sel = document.getElementById('month');
  sel.innerHTML = '<option value="all">All months</option>'+MONTHS.map(k=>'<option value="'+k+'">'+mlabel(k)+'</option>').join('');
  sel.value = S.month;
  sel.onchange = () => { S.month = sel.value; draw(); };
  document.getElementById('type').onchange = e => { S.type = e.target.value; draw(); };
  const sw = document.getElementById('sw');
  sw.oninput = () => { S.sw = +sw.value; document.getElementById('swv').textContent = S.sw+' wks'; draw(); };
}
function draw(){
  const v = VIEWS[S.view];
  document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-current', b.dataset.v===S.view));
  document.querySelectorAll('#brands .chip').forEach(c=>c.setAttribute('aria-pressed', S.brands.has(c.dataset.b)));
  document.getElementById('vt').textContent = v.t;
  document.getElementById('vd').textContent = v.d;
  document.getElementById('monthWrap').hidden = !v.month;
  document.getElementById('typeWrap').hidden = !v.type;
  document.getElementById('next').innerHTML='';
  v.r();
  document.getElementById('foot').innerHTML = '<b>Reading the dates.</b> Sell by = booking deadline minus the sell-in lead set above (default 6 weeks), a planning rule and not a Condé Nast date. Event dates are mid-month estimates (~) until confirmed. Issue dates come from the Pre-lim 1 schedules and may change when the final schedules are issued.'
    + (DATA.fixes.length ? ' <b>Check:</b> '+DATA.fixes.map(esc).join('; ')+'.' : '');
}
chrome(); draw();
